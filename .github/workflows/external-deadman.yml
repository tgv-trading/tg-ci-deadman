name: external-ci-deadman

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: external-ci-deadman
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run external heartbeat monitor
        env:
          DEADMAN_DISCORD_WEBHOOK: ${{ secrets.DEADMAN_DISCORD_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/check-heartbeat.py?ref=${GITHUB_SHA}" --jq .content \
            | base64 --decode > /tmp/check-heartbeat.py
          python3 /tmp/check-heartbeat.py
